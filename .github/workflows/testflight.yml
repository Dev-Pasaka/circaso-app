name: TestFlight

# Every push to main archives the iOS app and uploads it to TestFlight for com.circaso.app (2026-11-10), as
# play-internal.yml does for Play. It can also be run by hand from the Actions tab. An archive is ~15 minutes of
# Kotlin/Native release linking (one core, can't be split), so it runs here instead of on a laptop.
#
# Signing is the same as an Xcode archive on the Mac: the archive is signed with an Apple Development certificate
# (automatic signing), and the export to App Store Connect is signed by Apple's cloud-managed distribution
# certificate through the API key. No distribution certificate or profile is kept here.
#
# Secrets (repository Settings > Secrets and variables > Actions):
#   ASC_KEY_ID                    App Store Connect API key id (Users and Access > Integrations > App Store Connect API)
#   ASC_ISSUER_ID                 that page's issuer id
#   ASC_KEY_P8                    the key's .p8 file, as is or base64. The key's role must be Admin: only Admin keys
#                                 may use cloud-managed distribution certificates and create profiles
#   IOS_DEV_CERT_P12_BASE64       the Apple Development certificate with its private key, exported from Keychain Access
#                                 as .p12: `base64 -i dev.p12 | tr -d '\n' | gh secret set IOS_DEV_CERT_P12_BASE64`
#   IOS_DEV_CERT_PASSWORD         the .p12's password
#   MAPS_IOS_KEY                  maps.ios.key (restricted to com.circaso.app)
#   CIRCLE_PWSDK_TOKEN            shared with play-internal.yml (pwsdk.maven.password); its user, CIRCLE_PWSDK_USERNAME,
#                                 is a variable
# Variables (same page, Variables tab):
#   TESTFLIGHT_ENABLED            set to true once the secrets above are in; until then the job is skipped
#   TESTFLIGHT_BUILD_BASE         added to the run number for the build number (CFBundleVersion); above the highest
#                                 build already uploaded for the current version (default 100; build 2 was by hand)
#   IOS_RUNNER                    the runner label (default macos-26: 3 cores, 7 GB). A larger runner, if the account has
#                                 one, shortens nothing much: the release link uses one core
#   IOS_GRADLE_HEAP               Gradle's heap on the runner (default 5g, leaving room for LLVM on 7 GB)
#   SHARE_HOST                    optional, the share-link host (the sandbox's when unset)
#
# The marketing version (1.0) comes from iosApp/Configuration/Config.xcconfig; bump it there for a new version.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false   # an upload in flight finishes; the next waits

permissions:
  contents: read

jobs:
  testflight:
    name: Archive and upload to TestFlight
    if: ${{ vars.TESTFLIGHT_ENABLED == 'true' }}
    runs-on: ${{ vars.IOS_RUNNER || 'macos-26' }}
    timeout-minutes: 90
    environment: testflight   # optional protection rules (who may publish) live on this environment
    env:
      ARCHIVE: ${{ github.workspace }}/build/Circaso.xcarchive
      KEYCHAIN: ${{ github.workspace }}/build/ci.keychain-db
    steps:
      - uses: actions/checkout@v4

      # Never ship a build that hides a feature behind the build type (scripts/debug-gates.txt).
      - name: No feature hidden behind debug builds
        run: python3 scripts/check_debug_gates.py

      - name: Xcode 26
        run: |
          xcode=$(find /Applications -maxdepth 1 -name "Xcode_26*.app" | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      # Kotlin/Native's toolchain (LLVM, the iOS platform libraries): about 1 GB, downloaded once per Kotlin version.
      - name: Kotlin/Native toolchain cache
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Pods cache
        uses: actions/cache@v4
        with:
          path: iosApp/Pods
          key: pods-${{ hashFiles('iosApp/Podfile.lock', 'iosApp/LocalPods/**') }}

      - name: Versions
        id: v
        run: |
          base="${{ vars.TESTFLIGHT_BUILD_BASE }}"
          build=$(( ${base:-100} + ${{ github.run_number }} ))
          version=$(sed -n 's/^MARKETING_VERSION=//p' iosApp/Configuration/Config.xcconfig)
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Version $version ($build)"

      - name: Local settings, signing certificate and API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_DEV_CERT_P12_BASE64: ${{ secrets.IOS_DEV_CERT_P12_BASE64 }}
          IOS_DEV_CERT_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
          MAPS_IOS_KEY: ${{ secrets.MAPS_IOS_KEY }}
          CIRCLE_PWSDK_USERNAME: ${{ secrets.CIRCLE_PWSDK_USERNAME || vars.CIRCLE_PWSDK_USERNAME }}
          CIRCLE_PWSDK_TOKEN: ${{ secrets.CIRCLE_PWSDK_TOKEN }}
          SHARE_HOST: ${{ vars.SHARE_HOST }}
          GRADLE_HEAP: ${{ vars.IOS_GRADLE_HEAP || '5g' }}
        run: |
          set -euo pipefail
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 IOS_DEV_CERT_P12_BASE64 IOS_DEV_CERT_PASSWORD MAPS_IOS_KEY; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is not set"; exit 1; }
          done
          mkdir -p build

          # The API key: the .p8 as is, or base64.
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$ASC_KEY_P8" > "$key"
          else
            printf '%s' "$ASC_KEY_P8" | tr -d ' \r\n' | base64 -D > "$key" 2>/dev/null \
              || { echo "::error::ASC_KEY_P8 is neither the .p8 file nor valid base64"; exit 1; }
          fi
          grep -q 'BEGIN PRIVATE KEY' "$key" || { echo "::error::ASC_KEY_P8 isn't a private key"; exit 1; }
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

          # The development certificate in a keychain of its own, unlocked for codesign.
          cert="$RUNNER_TEMP/dev.p12"
          printf '%s' "$IOS_DEV_CERT_P12_BASE64" | tr -d ' \r\n' | base64 -D > "$cert" 2>/dev/null \
            || { echo "::error::IOS_DEV_CERT_P12_BASE64 isn't valid base64"; exit 1; }
          pass=$(uuidgen)
          security create-keychain -p "$pass" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$pass" "$KEYCHAIN"
          security import "$cert" -k "$KEYCHAIN" -P "$IOS_DEV_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security \
            || { echo "::error::The .p12 didn't import: check IOS_DEV_CERT_PASSWORD"; exit 1; }
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pass" "$KEYCHAIN" > /dev/null
          read -r -a existing <<< "$(security list-keychains -d user | tr -d '"' | xargs)"
          security list-keychains -d user -s "$KEYCHAIN" "${existing[@]}"
          rm -f "$cert"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Development" \
            || { echo "::error::The .p12 has no Apple Development identity with its private key"; exit 1; }

          {
            echo "maps.ios.key=$MAPS_IOS_KEY"
            if [ -n "$CIRCLE_PWSDK_TOKEN" ]; then
              echo "pwsdk.maven.username=$CIRCLE_PWSDK_USERNAME"
              echo "pwsdk.maven.password=$CIRCLE_PWSDK_TOKEN"
            fi
            if [ -n "$SHARE_HOST" ]; then echo "share.host=$SHARE_HOST"; fi
          } > local.properties

          # Xcode's build phase runs ./gradlew itself; the user's gradle.properties outranks the project's 8 GB, which
          # would leave LLVM no room on a 7 GB runner.
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx$GRADLE_HEAP -XX:+UseParallelGC -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties

      - name: Pods
        working-directory: iosApp
        run: pod install --deployment

      - name: Archive
        working-directory: iosApp
        run: >-
          set -o pipefail &&
          xcodebuild archive
          -workspace iosApp.xcworkspace -scheme iosApp -configuration Release
          -destination 'generic/platform=iOS' -archivePath "$ARCHIVE"
          -allowProvisioningUpdates
          -authenticationKeyPath "$ASC_KEY_PATH"
          -authenticationKeyID "${{ secrets.ASC_KEY_ID }}"
          -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
          CURRENT_PROJECT_VERSION=${{ steps.v.outputs.build }}
          OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN"
          | tee "$RUNNER_TEMP/archive.log" | grep -E '^(error|warning: .*sign)|\*\* ARCHIVE|^PhaseScriptExecution|^> Task' || true;
          grep -q '\*\* ARCHIVE SUCCEEDED' "$RUNNER_TEMP/archive.log"

      - name: Upload to TestFlight
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>985W5Z7984</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$ARCHIVE" -exportPath build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" | tee "$RUNNER_TEMP/upload.log" | grep -vE '^[0-9-]+ [0-9:.]+ xcodebuild\[.*Progress' || true
          grep -q 'EXPORT SUCCEEDED' "$RUNNER_TEMP/upload.log" || { echo "::error::Upload failed (see the upload log artifact)"; exit 1; }
          echo "::notice::Uploaded build ${{ steps.v.outputs.build }}; it shows in TestFlight once Apple has processed it"

      - name: Keep the logs and symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-${{ steps.v.outputs.build }}
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/upload.log
            build/Circaso.xcarchive/dSYMs
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove the keys from the runner
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/dev.p12" local.properties
